# Иконка приложения. Применяется командой: dart run tool/setup_platforms.dart
# (скрипт отключает платформы, папок которых нет).
flutter_launcher_icons:
  image_path: assets/branding/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#5B5BF0"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  adaptive_icon_monochrome: assets/branding/icon_monochrome.png
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#F5F6FB"
    theme_color: "#5B5BF0"
