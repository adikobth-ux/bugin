name: Build

# Проверка кода, тесты, APK для Android и веб-версия на GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # Папки android/ и web/ создаются здесь, существующие файлы не меняются.
      - name: Create platform folders
        run: flutter create . --platforms=android,web --org kz.bugin --project-name bugin

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: .github/scripts/run.sh "flutter analyze" flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: .github/scripts/run.sh "flutter test" flutter test --reporter expanded

      - name: Build APK
        run: .github/scripts/run.sh "build apk" flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: bugin-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build web
        run: .github/scripts/run.sh "build web" flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      # APK кладём рядом с веб-версией, чтобы скачать его прямо с телефона.
      - name: Add APK to web build
        run: cp build/app/outputs/flutter-apk/app-release.apk build/web/bugin.apk

      - name: Upload web build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
