name: Build

# Проверка кода, тесты, APK для Android и веб-версия на GitHub Pages.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Адрес сервера для APK и веб-версии (без /v1). Переопределяется переменной
      # репозитория BUGIN_API_URL (Settings → Secrets and variables → Actions → Variables);
      # значение mock — собрать на тестовых данных внутри приложения, без сервера.
      BUGIN_API_URL: ${{ vars.BUGIN_API_URL || 'https://bugin-api.onrender.com' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # Папки android/ и web/ создаются здесь, существующие файлы не меняются.
      - name: Create platform folders
        run: flutter create . --platforms=android,web --org kz.bugin --project-name bugin

      - name: Get packages
        run: flutter pub get

      # Название Bugin, языки, иконка и заставка для созданных платформ.
      - name: Set up platforms
        run: .github/scripts/run.sh "setup platforms" dart run tool/setup_platforms.dart

      - name: Analyze
        run: .github/scripts/run.sh "flutter analyze" flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: .github/scripts/run.sh "flutter test" flutter test --reporter expanded

      # ${BUGIN_API_URL#mock}: значение mock превращается в пустую строку.
      - name: Build APK
        run: .github/scripts/run.sh "build apk" flutter build apk --release "--dart-define=BUGIN_API_URL=${BUGIN_API_URL#mock}"

      # Подпись (одна на все сборки) и доступ в интернет, без него сервер недоступен.
      - name: APK check
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          apk=build/app/outputs/flutter-apk/app-release.apk
          echo "::notice title=APK signature::$("$tools/apksigner" verify --print-certs "$apk" | grep -m1 'SHA-256')"
          permissions=$("$tools/aapt2" dump permissions "$apk")
          if ! echo "$permissions" | grep -q 'android.permission.INTERNET'; then
            echo "::error title=APK::нет разрешения INTERNET — приложение не достучится до сервера"
            exit 1
          fi
          if ! echo "$permissions" | grep -q 'android.permission.ACCESS_FINE_LOCATION'; then
            echo "::error title=APK::нет разрешения на геолокацию — «рядом» не будет работать"
            exit 1
          fi
          echo "::notice title=Сервер::${BUGIN_API_URL#mock}"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: bugin-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build web
        run: .github/scripts/run.sh "build web" flutter build web --release --base-href "/${{ github.event.repository.name }}/" "--dart-define=BUGIN_API_URL=${BUGIN_API_URL#mock}"

      # APK кладём рядом с веб-версией, чтобы скачать его прямо с телефона.
      - name: Add APK to web build
        run: cp build/app/outputs/flutter-apk/app-release.apk build/web/bugin.apk

      - name: Upload web build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
