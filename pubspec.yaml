name: bugin
description: "Bugin — чем заняться сегодня. Кликабельный frontend-прототип на mock data."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Избранное, профиль, история поиска и настройки на устройстве.
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Генераторы иконки и заставки: dart run tool/setup_platforms.dart
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Regular.ttf
          weight: 400
        - asset: assets/fonts/Onest-Medium.ttf
          weight: 500
        - asset: assets/fonts/Onest-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Onest-Bold.ttf
          weight: 700
        - asset: assets/fonts/Onest-ExtraBold.ttf
          weight: 800

# Заставка при запуске: фон как у приложения, логотип и подпись Bugin.
# Применяется командой: dart run tool/setup_platforms.dart
flutter_native_splash:
  color: "#F5F6FB"
  image: assets/branding/splash_logo.png
  branding: assets/branding/splash_branding.png
  branding_bottom_padding: 32
  android_12:
    color: "#F5F6FB"
    image: assets/branding/splash_android12.png
    icon_background_color: "#5B5BF0"
    branding: assets/branding/splash_branding.png
  web: true
